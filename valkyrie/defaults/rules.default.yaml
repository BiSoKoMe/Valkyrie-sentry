# Valkyrie user rules — edit and save; changes take effect within 5 seconds.
#
# This is the factory-default rule set created on first launch. It is safe to
# edit; your changes are never overwritten by updates.
#
#   always_allow: never block these domains (e.g. work tools, trusted services)
#   always_block: force-block these domains regardless of other decisions
#
# Wildcards: use *.example.com to match any subdomain.
# Process filter: add 'process: appname' to restrict a rule to one process.

always_allow:
  # Common collaboration tools people rarely want blocked. Remove any you don't use.
  - domain: "*.zoom.us"
  - domain: "*.slack.com"
  - domain: "*.microsoft.com"

always_block:
  # A small set of well-known advertising / tracking domains as a sensible
  # starting point. Valkyrie's intelligence engine blocks far more automatically.
  - domain: "*.doubleclick.net"
  - domain: "doubleclick.net"
  - domain: "*.googlesyndication.com"
  - domain: "googlesyndication.com"
  - domain: "*.google-analytics.com"
  - domain: "google-analytics.com"
  - domain: "*.adservice.google.com"
