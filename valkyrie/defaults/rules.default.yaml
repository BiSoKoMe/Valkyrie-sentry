# Valkyrie user rules — OPTIONAL manual overrides. Empty by default.
#
# Valkyrie does NOT ship a hand-written blocklist. Every decision is made by its
# analysis engine — the site scanner, the behavioural/anomaly intelligence layer,
# the DGA and DNS-tunnel classifiers, and live threat-intel IOC feeds. It finds
# and analyses anomalies and malicious behaviour on its own; it does not rely on
# a human maintaining a list of domains.
#
# These two lists exist ONLY as a personal override if you ever want to force a
# specific decision. They start empty on purpose — leave them empty and let the
# engine decide, or add your own entries. Your edits are never overwritten.
#
#   always_allow: never block these domains (your escape hatch if analysis ever
#                 gets one wrong on your machine)
#   always_block: force-block these domains regardless of what analysis decides
#
# Wildcards: use *.example.com to match any subdomain.
# Process filter: add 'process: appname' to restrict a rule to one process.
#
# Example (commented out — uncomment and edit only if you actually want it):
#   always_allow:
#     - domain: "*.your-internal-tool.com"
#   always_block:
#     - domain: "annoying-tracker.example"

always_allow: []

always_block: []
