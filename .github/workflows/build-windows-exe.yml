name: Build valkyrie_test.exe (Windows)

# Builds the full application — DNS/firewall/intelligence, the web dashboard,
# and the complete EDR layer (incidents, timelines, hunting, plugins, live
# telemetry, signed remote response, AI-assisted investigation) — into a single
# Windows executable on a real Windows runner, and uploads it for download.
#
# PyInstaller cannot cross-compile, which is why this runs on windows-latest
# rather than being built in a Linux dev container.

on:
  workflow_dispatch:          # run on demand from the Actions tab
  push:
    branches:
      - master
      - main
    paths:                    # only rebuild when packaging-relevant files change
      - "valkyrie/**"
      - "tests/**"
      - "electron/**"
      - "installer/**"
      - "browser_extension/**"
      - ".github/workflows/tests.yml"
      - "run_valkyrie.py"
      - "valkyrie.spec"
      - "requirements_modular.txt"
      - ".github/workflows/build-windows-exe.yml"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  qualification:
    uses: ./.github/workflows/tests.yml
  build:
    needs: qualification
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (everything, so the exe contains it all)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_modular.txt pyinstaller
          # Bundle the optional extras so valkyrie_test.exe contains ALL features:
          #   cryptography -> signed remote response over the fleet
          #   httpx        -> vendor-neutral AI investigation providers (opt-in at
          #                   runtime) + fleet control-plane client
          python -m pip install cryptography httpx

      - name: Build valkyrie_test.exe
        shell: pwsh
        env:
          VALKYRIE_EXE_NAME: valkyrie_test
        run: |
          python -m PyInstaller --clean --noconfirm valkyrie.spec
          if (-not (Test-Path "dist/valkyrie_test.exe")) {
            Write-Error "dist/valkyrie_test.exe was not produced"; exit 1
          }
          Get-Item dist/valkyrie_test.exe | Format-List Name, Length

      - name: Smoke-test the frozen exe
        timeout-minutes: 3
        shell: pwsh
        env:
          VALKYRIE_DATA_DIR: ${{ runner.temp }}/valkyrie-frozen-smoke
        run: |
          # A GUI-subsystem exe can return control before it exits. Wait for
          # the actual child and inspect its exit code, not stale LASTEXITCODE.
          $exePath = (Resolve-Path -LiteralPath 'dist/valkyrie_test.exe').Path
          $hunt = Start-Process -FilePath $exePath -ArgumentList @('--hunt', 'list') -Wait -PassThru -WindowStyle Hidden
          if ($hunt.ExitCode -ne 0) { throw "Packaged hunt smoke test failed (exit $($hunt.ExitCode))" }
          $incidents = Start-Process -FilePath $exePath -ArgumentList '--incidents' -Wait -PassThru -WindowStyle Hidden
          if ($incidents.ExitCode -ne 0) { throw "Packaged incident smoke test failed (exit $($incidents.ExitCode))" }
          $artifactDigest = (Get-FileHash -LiteralPath 'dist/valkyrie_test.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$artifactDigest  valkyrie_test.exe" | Set-Content -LiteralPath 'dist/valkyrie_test.exe.sha256' -Encoding ascii
          Write-Host "Frozen exe smoke test passed."

      - name: Upload valkyrie_test.exe artifact
        # Skip on tag builds: the next step already attaches the exe to the
        # GitHub Release, which is downloadable on its own — uploading it a
        # second time as an Actions artifact just doubles storage use for no
        # reason, on every single tagged release.
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: valkyrie_test-windows
          path: |
            dist/valkyrie_test.exe
            dist/valkyrie_test.exe.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Attach exe to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body: |
            Local evaluation build. This executable has passed the repository's
            Windows qualification checks but is not code-signed. Keep this
            release as a draft until Authenticode signing and isolated Windows
            validation are complete.
          files: |
            dist/valkyrie_test.exe
            dist/valkyrie_test.exe.sha256
