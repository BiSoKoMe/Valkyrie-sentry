name: Tests

# Runs the Valkyrie unit test suite on every push and pull request. The existing
# build-windows-exe workflow only *packages* the app; it never ran the tests, so
# a regression could ship green. This workflow closes that gap: it is the gate
# that must pass before any change to valkyrie/ or tests/ is trusted.
#
# Integration tests (test_dns, test_resolver) need a live resolver/server and are
# intentionally excluded here — the runner skips them unless invoked with --all.

on:
  push:
    branches:
      - main
      - master
    paths:
      - "valkyrie/**"
      - "tests/**"
      - "requirements_modular.txt"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "valkyrie/**"
      - "tests/**"
      - "requirements_modular.txt"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Runtime deps + the optional extras the test suite exercises
          # (cryptography → fleet signing/policy/updater; httpx → fleet TestClient).
          python -m pip install -r requirements_modular.txt
          python -m pip install cryptography httpx

      - name: Syntax / import gate
        run: python -m compileall -q valkyrie

      - name: Run unit test suite
        run: python tests/run_tests.py

  accel:
    name: Native accelerator (Rust) + suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install deps + build the accelerator
        run: |
          python -m pip install --upgrade pip maturin
          python -m pip install -r requirements_modular.txt cryptography httpx
          (cd rust/valkyrie_accel && maturin build --release)
          python -m pip install rust/valkyrie_accel/target/wheels/*.whl
      - name: Run suite with the Rust backend active
        run: |
          python -c "from valkyrie import firewall; assert firewall._IPSET_BACKEND=='rust'; print('Rust backend active')"
          python tests/run_tests.py

  efficacy:
    name: Detection-efficacy gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_modular.txt
          python -m pip install cryptography httpx
      - name: Detection-efficacy scorecard (regression gate)
        # Drives the REAL classifiers against the technique-representative
        # corpus and fails the build if recall < 85% or FPR > 5%. This makes a
        # change that quietly degrades detection a red build, not a silent ship.
        run: PYTHONUTF8=1 python tests/efficacy/harness.py

  fp-gate:
    name: False-positive gate (benign corpus)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_modular.txt
          python -m pip install cryptography httpx
      - name: 699 real domains must never be blocked
        # The regression gate for the two false positives this project has
        # actually shipped. An FP returns 0.0.0.0 and kills a real site, which
        # for this product is worse than a missed detection — so it gates.
        run: PYTHONUTF8=1 python tests/test_benign_corpus.py
      - name: Decision-matrix precedence
        run: PYTHONUTF8=1 python tests/test_dns_decision_matrix.py
      - name: A false positive must never persist as a verdict
        run: PYTHONUTF8=1 python tests/test_verdict_persistence.py

  fuzz:
    name: Parser fuzzing (10k inputs each)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_modular.txt
          python -m pip install cryptography httpx
      - name: Fuzz every parser with 10,000 hostile inputs
        # TEST_PLAN tier 2: "every parser survives 10k malformed inputs".
        # Seeded, so a CI failure reproduces exactly from the printed seed.
        run: PYTHONUTF8=1 python tests/test_fuzz_parsers.py 10000
      - name: Classifier invariants
        run: PYTHONUTF8=1 python tests/test_classifier_properties.py
      - name: Resource bounds hold under pressure
        run: PYTHONUTF8=1 python tests/test_resource_bounds.py

  coverage:
    name: Coverage floor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_modular.txt
          python -m pip install cryptography httpx coverage
      - name: Measure coverage and enforce the floor
        # Measured 59% when this gate was introduced, 64% after TEST_PLAN
        # tiers 1-3, 65% after the security/lifecycle audit. The floor is a
        # RATCHET: raise it as coverage improves, never lower it to make a
        # build pass. A change that drops coverage below the floor is a change
        # that removed tested behaviour.
        #
        # Kept a few points under the measured figure on purpose: CI installs a
        # different optional-dependency set than a dev box (lxml, mitmproxy),
        # which legitimately moves the number by a point or two, and a gate
        # that flaps gets disabled by whoever it annoys first.
        run: |
          COVERAGE_FLOOR=62
          for t in tests/test_*.py; do
            PYTHONUTF8=1 python -m coverage run --append --source=valkyrie "$t" \
              >/dev/null 2>&1 || true
          done
          python -m coverage report --fail-under=$COVERAGE_FLOOR

  lint:
    name: Lint + security (gating)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff + bandit
        run: python -m pip install ruff bandit
      # Promoted from advisory to gating. It was `continue-on-error: true`,
      # which meant a red lint never blocked anything — a gate that cannot fail
      # is decoration.
      - name: Ruff (real-error rules)
        run: ruff check --select E9,F63,F7,F82 valkyrie
      - name: Bandit (HIGH severity, HIGH confidence)
        # Deliberately narrow so it can actually gate today. The remaining
        # medium findings (B104 bind-all, B310 urlopen, B314 XML parsing) are
        # real review items tracked in docs/TEST_PLAN.md tier 2 — widen this to
        # -ll once they are triaged, rather than starting non-gating.
        run: bandit -r valkyrie -q -lll -iii
