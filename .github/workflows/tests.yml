name: Tests

# Runs the Valkyrie unit test suite on every push and pull request. The existing
# build-windows-exe workflow only *packages* the app; it never ran the tests, so
# a regression could ship green. This workflow closes that gap: it is the gate
# that must pass before any change to valkyrie/ or tests/ is trusted.
#
# Integration tests (test_dns, test_resolver) need a live resolver/server and are
# intentionally excluded here — the runner skips them unless invoked with --all.

on:
  push:
    branches:
      - main
      - master
      - "claude/**"
    paths:
      - "valkyrie/**"
      - "tests/**"
      - "requirements_modular.txt"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "valkyrie/**"
      - "tests/**"
      - "requirements_modular.txt"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Runtime deps + the optional extras the test suite exercises
          # (cryptography → fleet signing/policy/updater; httpx → fleet TestClient).
          python -m pip install -r requirements_modular.txt
          python -m pip install cryptography httpx

      - name: Syntax / import gate
        run: python -m compileall -q valkyrie

      - name: Run unit test suite
        run: python tests/run_tests.py

  accel:
    name: Native accelerator (Rust) + suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install deps + build the accelerator
        run: |
          python -m pip install --upgrade pip maturin
          python -m pip install -r requirements_modular.txt cryptography httpx
          (cd rust/valkyrie_accel && maturin build --release)
          python -m pip install rust/valkyrie_accel/target/wheels/*.whl
      - name: Run suite with the Rust backend active
        run: |
          python -c "from valkyrie import firewall; assert firewall._IPSET_BACKEND=='rust'; print('Rust backend active')"
          python tests/run_tests.py

  lint:
    name: Lint (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true   # advisory for now; not a merge gate yet
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: python -m pip install ruff
      - name: Ruff (syntax-level checks only)
        run: ruff check --select E9,F63,F7,F82 valkyrie
