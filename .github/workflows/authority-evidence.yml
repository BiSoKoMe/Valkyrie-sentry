name: Causal authority evidence

on:
  workflow_dispatch:
  push:
    paths:
      - "browser_extension/**"
      - "valkyrie/browser_context.py"
      - "valkyrie/causal_authority.py"
      - "valkyrie/authority_experiment.py"
      - "tools/authority_experiment.py"
      - "tests/test_browser_context.py"
      - "tests/test_causal_authority.py"
      - "tests/test_authority_experiment.py"
      - ".github/workflows/authority-evidence.yml"
  pull_request:
    paths:
      - "browser_extension/**"
      - "valkyrie/browser_context.py"
      - "valkyrie/causal_authority.py"
      - "valkyrie/authority_experiment.py"
      - "tools/authority_experiment.py"
      - "tests/test_browser_context.py"
      - "tests/test_causal_authority.py"
      - "tests/test_authority_experiment.py"
      - ".github/workflows/authority-evidence.yml"

jobs:
  windows-evidence:
    name: Fixed 500 + 100 corpus on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_modular.txt
          python -m pip install pytest httpx

      - name: Run focused regression tests
        shell: pwsh
        run: |
          python -m pytest -q `
            tests/test_causal_authority.py `
            tests/test_browser_context.py `
            tests/test_authority_experiment.py

      - name: Run frozen evidence corpus
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          python tools/authority_experiment.py `
            --authorized 500 `
            --unauthorized 100 `
            --max-p99-ms 10 `
            --output artifacts/authority-evidence.json `
            --report artifacts/AUTHORITY_EXPERIMENT_REPORT.md

      - name: Upload raw evidence and report
        uses: actions/upload-artifact@v4
        with:
          name: causal-authority-evidence-windows-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
