name: Platform Beta 0.5 (telemetry reliability)

# Answers a different question than Red Team Tier B (redteam-tierb.yml):
# not "does technique T get detected" but "can Valkyrie stay alive and keep
# producing a trustworthy event stream under repeated real activity for a
# meaningful period." See docs/BETA_0_5_TELEMETRY_RELIABILITY.md - that
# document is the predeclared spec; redteam/evaluation/beta05_reliability.py
# implements exactly what it says.
#
# Manual trigger only. Qualification modes run in this order per the doc's own
# sequence:
#   dry-run     ~5 minutes  - validates the harness + artifact pipeline
#   fault-test  ~2 minutes  - proves the watchdog catches a stalled collector
#   contention  <=25 min    - one-run, stop-on-first-failure attribution
#   soak        20-30 min   - the real qualification run, repeated on 3
#                             independent fresh runners (matrix), never one
#   profile     <=25 min    - 2026-08-31 CPU-attribution review: one isolated
#                             workload (idle/benign/full, see --workload) for
#                             the WHOLE run, no phase progression - diagnostic
#                             only, never a qualification pass/fail

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Which Beta 0.5 stage to run"
        type: choice
        options: [dry-run, fault-test, contention, soak, profile]
        default: dry-run
      minutes:
        description: "soak/contention/profile maximum duration in minutes"
        type: string
        default: "25"
      workload:
        description: "profile mode only: which controlled experiment to run"
        type: choice
        options: [idle, benign, full]
        default: full
      attach_profiler:
        description: "profile mode only: attach py-spy (a sampling profiler) and rank hot functions"
        type: boolean
        default: false

jobs:
  plan:
    # A job-level `if:` cannot see the `matrix` context (matrix expansion
    # happens after that condition is evaluated), so the "only soak needs 3
    # independent runs" choice has to be computed as a separate small job and
    # fed into the real job's matrix via fromJSON - the standard pattern for
    # an input-dependent matrix size.
    name: Plan run count
    runs-on: ubuntu-latest
    outputs:
      run_indices: ${{ steps.plan.outputs.run_indices }}
    steps:
      - id: plan
        shell: bash
        run: |
          if [ "${{ inputs.mode }}" = "soak" ]; then
            echo 'run_indices=[1,2,3]' >> "$GITHUB_OUTPUT"
          else
            echo 'run_indices=[1]' >> "$GITHUB_OUTPUT"
          fi

  run:
    name: Beta 0.5 (${{ inputs.mode }}) run ${{ matrix.run_index }}
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # dry-run and fault-test only need one independent run; soak needs
        # three (docs/LIVE_FIRE_EVALUATION.md's own principle: shared CI can
        # be transiently slow, so a single clean run is weak evidence alone).
        run_index: ${{ fromJSON(needs.plan.outputs.run_indices) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Valkyrie dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_modular.txt
          python -m pip install pytest
          if ("${{ inputs.attach_profiler }}" -eq "true") {
            python -m pip install py-spy
          }

      - name: Provision (Sysmon + PS logging + Invoke-AtomicRedTeam)
        shell: pwsh
        run: redteam\provision.ps1

      - name: "Run Platform Beta 0.5"
        shell: pwsh
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          $mode = "${{ inputs.mode }}"
          if ($mode -eq "profile") {
            $pyspyArgs = @()
            if ("${{ inputs.attach_profiler }}" -eq "true") { $pyspyArgs = @("--attach-pyspy") }
            python redteam\evaluation\beta05_reliability.py --mode $mode --minutes ${{ inputs.minutes }} --workload ${{ inputs.workload }} @pyspyArgs
          } elseif ($mode -eq "soak" -or $mode -eq "contention") {
            python redteam\evaluation\beta05_reliability.py --mode $mode --minutes ${{ inputs.minutes }}
          } else {
            python redteam\evaluation\beta05_reliability.py --mode $mode
          }
          $exit = $LASTEXITCODE
          Write-Host "beta05_reliability.py exited $exit"
          exit $exit

      - name: Platform Alpha frozen baseline (no reasoning-layer regression)
        if: always()
        shell: pwsh
        run: |
          python -m pytest tests/test_platform_alpha_baseline.py -q
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Platform Alpha baseline regressed - this fails criterion 8 regardless of the Beta 0.5 run's own verdict above."
          }
          exit $LASTEXITCODE

      - name: Upload Beta 0.5 evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: beta05-${{ inputs.mode }}${{ inputs.mode == 'profile' && format('-{0}', inputs.workload) || '' }}-run${{ matrix.run_index }}
          path: |
            redteam/evaluation/results/beta05_*.json
            redteam/evaluation/results/beta05_*.jsonl
            redteam/evaluation/results/beta05_*.log
            redteam/evaluation/results/beta05_*.raw
          if-no-files-found: warn
          retention-days: 30
