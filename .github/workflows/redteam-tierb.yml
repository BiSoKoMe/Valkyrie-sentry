name: Red Team Tier B (live evaluation)

# The one measurement this project has never produced: a real Atomic Red Team
# run against a REAL, RUNNING Valkyrie instance, instead of Tier A's classifier
# replay. redteam/evaluation/run_live_evaluation.ps1 has existed, fully authored,
# since before this workflow — this file's only job is to give it somewhere to
# actually run. The GitHub-hosted windows-latest runner is disposable by
# construction (destroyed after the job), which is exactly the "throwaway VM
# with a fresh snapshot" the script's own header demands.
#
# Manual trigger only — this never runs on a push. Defaults to
# -SkipDestructive so the first (and default) run excludes the catalog's
# genuinely destructive atomics (Defender disable, shadow-copy deletion,
# event-log clearing, service stop, local-account creation). Set the
# skip_destructive input to false only with intent.
#
# Scoped to loopback: Valkyrie starts with --no-dns --no-firewall --no-unbound
# --no-tls so this never touches the runner's real DNS, firewall, or TLS
# config — only the EDR/detection layer answering on 127.0.0.1:8090 is live.
#
# TWO JOBS, ONE REUSABLE WORKFLOW (added 2026-08-26, catalog 52 -> 90+):
# the actual "start Valkyrie, run the battery, score it" body lives in
# tierb-run-reusable.yml now, called once per job below, so the hard-won
# operational logic (engine-deafness retry, DNS-redirect safety preflight)
# exists in exactly one place regardless of which path runs.
#   - tier-b-single: the ORIGINAL, UNCHANGED behavior - one job, full catalog
#     by default, or -OnlyIds for isolating a single fix. Runs on push, and
#     on manual dispatch unless run_full_matrix is set.
#   - tier-b-matrix: NEW, opt-in - one parallel job per MITRE tactic
#     (-OnlyTactic), so the now-90-technique catalog doesn't need to fit in
#     one ~90min job. Only runs on manual dispatch with run_full_matrix=true
#     and only_ids empty.

on:
  workflow_dispatch:
    inputs:
      skip_destructive:
        description: "Skip the genuinely destructive atomics (Defender/firewall disable, shadow-copy delete, event-log clear, service stop, account create)"
        type: boolean
        default: true
      enable_network_layer:
        description: "Start the DNS + threat-intelligence layers so the C2 techniques are actually testable (they are scored as MISSED today because their detectors are switched off)"
        type: boolean
        default: false
      only_ids:
        description: "Comma-separated catalog ids to run in isolation (e.g. evasion-process-injection) - for verifying one Detection Coverage fix without running the full battery. Empty runs everything, unchanged. Ignored when run_full_matrix is true."
        type: string
        default: ""
      run_full_matrix:
        description: "Run the FULL catalog split across one parallel job per MITRE tactic instead of one long job. Added when the catalog grew past 52 -> 90+ techniques (see catalog.py's 2026-08-26 expansion) - a single job at the old ~90min pace no longer comfortably fits one run. Ignored (single-job path runs instead) if only_ids is also set."
        type: boolean
        default: false
  # Auto-run when this evaluation setup itself changes on the working branch, so
  # a live Tier B pass fires without needing the manual button (which GitHub only
  # exposes once the workflow reaches the default branch). The push-triggered run
  # ALWAYS skips destructive atomics — the safe subset — regardless of inputs.
  # THE DETECTION ENGINE ITSELF IS NOW A TRIGGER, not just the harness.
  #
  # Until 2026-08-25 this only fired on changes to redteam/**, which meant the
  # scoreboard measured the MEASURING APPARATUS and never the thing being
  # measured. 109 imported vendor rules, a code-signature layer and a causal
  # detector all shipped without a single live number, and the run that finally
  # checked them found they were worth exactly +1 technique (29 -> 30 of 52).
  # Weeks of work went into an axis that evidence would have shown was nearly
  # exhausted, because nothing forced the evidence to appear.
  #
  # A stale number is worse than no number: it lets you believe you are
  # improving. So every change to the engine now measures itself. This is a
  # process fix, not a discipline fix - remembering to run it is exactly what
  # failed.
  push:
    branches: [feat/efficacy-etw-coverage]
    paths:
      - ".github/workflows/redteam-tierb.yml"
      - "redteam/**"
      - "valkyrie/**"

jobs:
  tier-b-single:
    # Original path, unchanged behavior: push triggers always land here (full
    # catalog, destructive skipped); manual dispatch lands here unless
    # run_full_matrix is requested.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_full_matrix != true)
    uses: ./.github/workflows/tierb-run-reusable.yml
    with:
      skip_destructive: ${{ github.event_name != 'workflow_dispatch' && true || inputs.skip_destructive }}
      enable_network_layer: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_network_layer || false }}
      only_ids: ${{ github.event_name == 'workflow_dispatch' && inputs.only_ids || '' }}

  tier-b-matrix:
    # New, opt-in path: the full 90+-technique catalog split one job per real
    # MITRE tactic (Technique.tactic, not the batch/grouping keys catalog.py
    # prints under - those are commit-history labels like "Breadth expansion
    # round 2", not tactics). Update this list if catalog.py ever introduces
    # an 11th tactic; `python redteam/evaluation/catalog.py` prints per-batch
    # counts, or run:
    #   python -c "from redteam.evaluation.catalog import all_in_scope; print(sorted(set(t.tactic for t in all_in_scope())))"
    if: github.event_name == 'workflow_dispatch' && inputs.run_full_matrix == true && inputs.only_ids == ''
    strategy:
      fail-fast: false
      matrix:
        tactic:
          - "Discovery"
          - "Defense Evasion"
          - "Execution"
          - "Persistence"
          - "Credential Access"
          - "Command and Control"
          - "Privilege Escalation"
          - "Collection"
          - "Lateral Movement"
          - "Impact"
    uses: ./.github/workflows/tierb-run-reusable.yml
    with:
      skip_destructive: ${{ inputs.skip_destructive }}
      enable_network_layer: ${{ inputs.enable_network_layer }}
      only_tactic: ${{ matrix.tactic }}
      artifact_suffix: "-${{ matrix.tactic }}"
