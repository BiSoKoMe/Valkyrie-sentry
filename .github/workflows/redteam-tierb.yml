name: Red Team Tier B (live evaluation)

# The one measurement this project has never produced: a real Atomic Red Team
# run against a REAL, RUNNING Valkyrie instance, instead of Tier A's classifier
# replay. redteam/evaluation/run_live_evaluation.ps1 has existed, fully authored,
# since before this workflow — this file's only job is to give it somewhere to
# actually run. The GitHub-hosted windows-latest runner is disposable by
# construction (destroyed after the job), which is exactly the "throwaway VM
# with a fresh snapshot" the script's own header demands.
#
# Manual trigger only — this never runs on a push. Defaults to
# -SkipDestructive so the first (and default) run excludes the catalog's
# genuinely destructive atomics (Defender disable, shadow-copy deletion,
# event-log clearing, service stop, local-account creation). Set the
# skip_destructive input to false only with intent.
#
# Scoped to loopback: Valkyrie starts with --no-dns --no-firewall --no-unbound
# --no-tls so this never touches the runner's real DNS, firewall, or TLS
# config — only the EDR/detection layer answering on 127.0.0.1:8090 is live.

on:
  workflow_dispatch:
    inputs:
      skip_destructive:
        description: "Skip the genuinely destructive atomics (Defender/firewall disable, shadow-copy delete, event-log clear, service stop, account create)"
        type: boolean
        default: true
  # Auto-run when this evaluation setup itself changes on the working branch, so
  # a live Tier B pass fires without needing the manual button (which GitHub only
  # exposes once the workflow reaches the default branch). The push-triggered run
  # ALWAYS skips destructive atomics — the safe subset — regardless of inputs.
  push:
    branches: [feat/efficacy-etw-coverage]
    paths:
      - ".github/workflows/redteam-tierb.yml"
      - "redteam/**"

jobs:
  tier-b:
    name: Live evaluation (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Valkyrie dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_modular.txt

      - name: Provision (Sysmon + PS logging + Invoke-AtomicRedTeam)
        shell: pwsh
        run: redteam\provision.ps1

      - name: "Run Tier B (start Valkyrie + real Atomic Red Team, one step)"
        shell: pwsh
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          # Start Valkyrie AND run the eval in the SAME step. A background process
          # started in a separate step does not reliably survive into the next one
          # on the runner, so the eval script's own health check (line ~203) found
          # a dead API even though the prior step confirmed it up. One step keeps
          # the agent alive for the whole battery.
          $p = Start-Process -FilePath python `
            -ArgumentList "-m", "valkyrie", "--web", "--web-port", "8090", `
              "--no-dns", "--no-firewall", "--no-unbound", "--no-tls", "--no-sysmon-setup" `
            -RedirectStandardOutput "valkyrie_stdout.log" `
            -RedirectStandardError "valkyrie_stderr.log" `
            -PassThru -WindowStyle Hidden
          $p.Id | Out-File valkyrie.pid

          $deadline = (Get-Date).AddSeconds(90); $up = $false
          do {
            Start-Sleep -Seconds 2
            try {
              Invoke-RestMethod -Uri "http://127.0.0.1:8090/api/health" -TimeoutSec 3 | Out-Null
              $up = $true; break
            } catch {}
          } while ((Get-Date) -lt $deadline)
          if (-not $up) {
            Write-Error "Valkyrie API never answered on :8090 within 90s"
            Get-Content valkyrie_stdout.log, valkyrie_stderr.log -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "Valkyrie API is answering (pid $($p.Id)). Running Tier B..."

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $skip = "${{ inputs.skip_destructive }}" -eq "true"
          } else {
            # Destructive battery ON — the runner is a disposable VM (exactly the
            # "throwaway snapshot" the eval header requires), so run the full,
            # aggressive set: LSASS dumping, ransomware canaries, Defender-disable,
            # shadow-copy deletion, service-stop, account creation. This is where
            # the impact / defense-evasion / credential-access rules get tested.
            $skip = $false
          }
          try {
            # Root cause fixed: the scorer polled the FULL incidents endpoint
            # (per-incident impact assessment, O(incidents)) with a 10s timeout,
            # so under load every poll returned empty and every real detection
            # scored MISS. The engine now serves a brief=true fast path and the
            # scorer polls it. Run the real battery and read the true number.
            redteam\evaluation\run_live_evaluation.ps1 -SkipDestructive:$skip -ApiBase "http://127.0.0.1:8090" -DetectWindowSeconds 12 *>&1 |
              Tee-Object -FilePath tierb_transcript.log
            # Coverage is read AFTER Valkyrie stops, straight from the SQLite
            # incident store (the 'Authoritative coverage' step below). The live
            # API is unreliable under battery load — even the brief read times
            # out while the engine drains its ingestion backlog — so we do not
            # ask the API at all; we read ground truth from the DB at rest.
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Stop Valkyrie
        if: always()
        shell: pwsh
        run: |
          if (Test-Path valkyrie.pid) {
            Stop-Process -Id (Get-Content valkyrie.pid) -Force -ErrorAction SilentlyContinue
          }

      - name: Authoritative coverage (read incident DB at rest)
        if: always()
        shell: pwsh
        run: |
          Start-Sleep -Seconds 6   # let the stopped engine's SQLite settle
          $db = Get-ChildItem -Path "D:\a" -Recurse -Filter valkyrie.db -EA SilentlyContinue |
                Select-Object -First 1
          if (-not $db) { Write-Host "NO valkyrie.db found under D:\a"; exit 0 }
          Write-Host ("DB: " + $db.FullName)
          Write-Host "==================== AUTHORITATIVE LIVE COVERAGE ===================="
          python redteam\evaluation\db_coverage.py $db.FullName

          # DIAGNOSTIC (temporary): T1003.001 missed 2/2 destructive runs. Prove
          # whether Sysmon EID10 (ProcessAccess->lsass.exe) fired at all for the
          # Dumpert atomic (direct-syscall LSASS read, T1003.001-3) — Sysmon
          # service outlives Valkyrie so this is readable after stop.
          Write-Host "==================== SYSMON EID10->lsass.exe RAW COUNT ===================="
          try {
            $ev = Get-WinEvent -FilterHashtable @{ LogName='Microsoft-Windows-Sysmon/Operational'; Id=10 } -ErrorAction Stop |
                  Where-Object { $_.Message -match 'lsass\.exe' }
            Write-Host ("EID10->lsass.exe events found: " + (@($ev).Count))
            $ev | Select-Object -First 5 | ForEach-Object {
              $ga = if ($_.Message -match 'GrantedAccess:\s*(\S+)') { $Matches[1] } else { '?' }
              $src = if ($_.Message -match 'SourceImage:\s*(\S+)') { $Matches[1] } else { '?' }
              Write-Host ("  EID10 SourceImage=$src GrantedAccess=$ga")
            }
          } catch { Write-Host ("EID10 query error: " + $_.Exception.Message) }

      - name: Print results to the run log (artifact-independent)
        if: always()
        shell: pwsh
        run: |
          Write-Host "==================== TIER B TRANSCRIPT (tail) ===================="
          if (Test-Path tierb_transcript.log) { Get-Content tierb_transcript.log -Tail 160 }
          else { Write-Host "(no transcript — run step did not produce one)" }
          Write-Host "==================== RESULTS JSON ===================="
          $r = Get-ChildItem redteam/evaluation/results/*.json -ErrorAction SilentlyContinue
          if ($r) { $r | ForEach-Object { Write-Host "----- $($_.Name) -----"; Get-Content $_.FullName } }
          else { Write-Host "(no results json)" }
          Write-Host "==================== VALKYRIE STDOUT (sensor init) ===================="
          if (Test-Path valkyrie_stdout.log) { Get-Content valkyrie_stdout.log }
          else { Write-Host "(no stdout)" }
          Write-Host "==================== VALKYRIE STDERR (tail) ===================="
          if (Test-Path valkyrie_stderr.log) { Get-Content valkyrie_stderr.log -Tail 60 }
          Write-Host "==================== SENSOR / INTEGRITY PROBE ===================="
          Write-Host ("elevated=" + ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltinRole]::Administrator))
          try { $s = Get-Service Sysmon64 -ErrorAction Stop; Write-Host ("Sysmon64 service: " + $s.Status) } catch { try { $s = Get-Service Sysmon -ErrorAction Stop; Write-Host ("Sysmon service: " + $s.Status) } catch { Write-Host "Sysmon service: NOT FOUND" } }
          try { $n = (Get-WinEvent -LogName 'Microsoft-Windows-Sysmon/Operational' -MaxEvents 1 -ErrorAction Stop); Write-Host ("Sysmon log readable: YES (latest EID " + $n.Id + ")") } catch { Write-Host ("Sysmon log readable: NO -- " + $_.Exception.Message) }

      - name: Upload Tier B evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: tier-b-results
          path: |
            tierb_transcript.log
            valkyrie_stdout.log
            valkyrie_stderr.log
            redteam/evaluation/results/*.json
            redteam/evaluation/catalog_export.json
          if-no-files-found: warn
          retention-days: 30
