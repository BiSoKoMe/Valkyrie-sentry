name: Platform Beta 2 (Aegis live-fire)

# The next environmental wall docs/AEGIS_PLATFORM_BRIDGE.md's own closing
# line names: does the CanonicalEvent -> ExposureObservation bridge hold up
# over REAL events (a real browser process, real network connections, a
# real Nyx privacy observation), not the one hand-built, fabricated-but-
# structurally-real chain platform_alpha_evidence_story.py already proved.
# One-shot proof, not a sustained soak - DetectionArchitectureV2/aegis_bridge
# are pure translation logic with no long-running state of their own to
# stress under time, unlike Beta 0.5's collectors or Beta 1's mitmproxy
# addon.

on:
  workflow_dispatch:
  push:
    branches: [feat/efficacy-etw-coverage]
    paths:
      - ".github/workflows/platform-beta2-aegis.yml"
      - "redteam/evaluation/platform_beta2_aegis_live.py"
      - "valkyrie/aegis_bridge.py"
      - "valkyrie/aegis_exposure.py"
      - "valkyrie/edr/detection_v2.py"
      - "valkyrie/process_telemetry.py"
      - "valkyrie/network_telemetry.py"
      - "valkyrie/tls_addon.py"
      - "valkyrie/tls_inspector.py"
      - "nyx_live/**"

jobs:
  beta2-aegis-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Valkyrie + mitmproxy + Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_modular.txt
          python -m pip install mitmproxy playwright
          python -m playwright install --with-deps chromium
      - name: Resolve the test hostnames to loopback
        run: echo "127.0.0.1 firstparty.test tracker.test" | sudo tee -a /etc/hosts
      - name: "Run Platform Beta 2 (Aegis live-fire)"
        env:
          PYTHONUNBUFFERED: "1"
          VALKYRIE_ALLOW_EXPOSED_CA_KEY: "1"
        run: python redteam/evaluation/platform_beta2_aegis_live.py
      - name: Platform Alpha frozen baseline (no reasoning-layer regression)
        if: always()
        run: |
          python -m pip install pytest
          python -m pytest tests/test_platform_alpha_baseline.py tests/test_platform_alpha_evidence_story.py -q
      - name: Upload Beta 2 evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: beta2-aegis-live
          path: redteam/evaluation/results/beta2_aegis_live_*.json
          if-no-files-found: warn
          retention-days: 30
