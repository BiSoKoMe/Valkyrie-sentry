<!doctype html>
<html>
<head><meta charset="utf-8"><title>nyx-live-target</title></head>
<body>
<div id="canvas-fp">CANVAS:pending</div>
<div id="beacon-status">BEACON:pending</div>
<script>
// A REAL browser fingerprint + a REAL tracking beacon. Nothing here is
// synthetic: the canvas is drawn by this browser, the device id is generated by
// this browser's crypto.randomUUID(), and the beacon is a real fetch that must
// traverse Valkyrie's proxy. The harness measures what actually happened.
function canvasFp() {
  try {
    const c = document.createElement('canvas');
    c.width = 220; c.height = 40;
    const ctx = c.getContext('2d');
    ctx.textBaseline = 'top';
    ctx.font = "16px 'Arial'";
    ctx.fillStyle = '#f60'; ctx.fillRect(0, 0, 120, 20);
    ctx.fillStyle = '#069'; ctx.fillText('Nyx-fingerprint-\u{1F3AD}', 2, 15);
    ctx.fillStyle = 'rgba(102,204,0,0.7)'; ctx.fillText('canvas-probe', 4, 22);
    return c.toDataURL();
  } catch (e) { return 'canvas-error:' + e; }
}
function hash(s) { let h = 0; for (let i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) >>> 0; } return h; }

(async () => {
  const cfp = canvasFp();
  const ch = hash(cfp);
  window.__canvasHash = ch;
  document.getElementById('canvas-fp').textContent = 'CANVAS:' + ch;

  const params = new URLSearchParams(location.search);
  const tracker = params.get('tracker') || '';
  // Opt-in, additive: when absent, behavior is byte-for-byte what it always
  // was (the 'adid=' field is included). When present, the beacon carries
  // NO personal data at all - the "third party, nothing to fake" case
  // (nyx_scorecard.py's 'benign' category), replayed through a real browser
  // instead of only a synthetic string.
  const noPersonal = params.get('nopersonal') === '1';
  // A proper UUID-v4 string, generated without crypto.randomUUID (which needs a
  // secure context that plain HTTP is not) so it matches Nyx's real detection.
  function uuid() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      const r = Math.random() * 16 | 0;
      return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
  }
  const id = uuid();
  window.__beaconId = id;
  if (!tracker) { document.getElementById('beacon-status').textContent = 'BEACON:no-tracker'; return; }
  const body = (noPersonal ? '' : 'adid=' + id + '&')
    + 'screen=' + screen.width + 'x' + screen.height
    + '&timezone=' + (Intl.DateTimeFormat().resolvedOptions().timeZone || 'x')
    + '&lang=' + navigator.language
    + '&cores=' + (navigator.hardwareConcurrency || 0);
  // Exposed so a harness driving this page can compare what it INTENDED to
  // send against what the tracker endpoint actually received, without
  // needing to reconstruct this string independently.
  window.__beaconBody = body;
  // Beacon to a NON-tracker path (/api/ingest) so it reaches Nyx's act layer
  // rather than being blocked at the tracker-beacon-path rule (which /collect,
  // /track, /pixel etc. correctly are). This measures the FAKING, not blocking.
  try {
    await fetch(tracker + '/api/ingest', {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: body,
    });
    document.getElementById('beacon-status').textContent = 'BEACON:sent';
  } catch (e) {
    document.getElementById('beacon-status').textContent = 'BEACON:err ' + e;
  }
})();
</script>
</body>
</html>
