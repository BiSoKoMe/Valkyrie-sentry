[package]
name = "valkyrie_accel"
version = "0.1.0"
edition = "2021"
description = "Optional native accelerators for Valkyrie (CIDR membership)."
license = "MIT"

[lib]
name = "valkyrie_accel"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
